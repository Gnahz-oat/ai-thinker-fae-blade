name: Validate bundle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skills/ai-thinker-fae-blade/scripts/requirements.txt
      - run: python skills/ai-thinker-fae-blade/scripts/blade.py validate
      - run: python -m unittest discover -s tests -v
